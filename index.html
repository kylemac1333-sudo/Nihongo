<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Japanese Sensei</title>
  <meta name="description" content="Learn beginner Japanese with lessons, quizzes, speaking and a friendly Sensei.">
  <meta name="theme-color" content="#c8102e">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c8102e'/%3E%3Ccircle cx='50' cy='50' r='26' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1" aria-live="polite">
      <noscript>Japanese Sensei needs JavaScript to run.</noscript>
    </main>
    <!-- Main navigation. The Admin tab is hidden by default and only shown
         by app.js when the logged-in account has role="admin". -->
    <nav id="nav" class="bottom" aria-label="Main navigation">
      <button data-act="nav" data-v="home"><span aria-hidden="true">🏠</span><small>Home</small></button>
      <button data-act="nav" data-v="learn"><span aria-hidden="true">📚</span><small>Learn</small></button>
      <button data-act="nav" data-v="talk"><span aria-hidden="true">🎤</span><small>Talk</small></button>
      <button data-act="nav" data-v="family"><span aria-hidden="true">🏆</span><small>Family</small></button>
      <button data-act="nav" data-v="profile"><span aria-hidden="true">👤</span><small>Profile</small></button>
      <button id="navAdmin" data-act="nav" data-v="admin" hidden><span aria-hidden="true">👑</span><small>Admin</small></button>
    </nav>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
